<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 395" role="img" aria-label="Memory cell and read write peripheral roles"><title>Memory cell and read write peripheral roles</title><rect width="100%" height="100%" fill="#f8fafb"/><style>text{font:15px sans-serif;fill:#192c38}.small{font-size:12px}.label{font-weight:bold}</style><text x="30" y="28" class="label">Read path with abstract stateful device</text><rect x="30" y="80" width="150" height="80" fill="#d7e8ed" stroke="#255965"/><text x="42" y="125">Read/write driver</text><rect x="260" y="80" width="170" height="80" fill="#d7e8ed" stroke="#255965"/><text x="272" y="125">Access isolation</text><rect x="510" y="80" width="170" height="80" fill="#d7e8ed" stroke="#255965"/><text x="522" y="125">Stateful cell</text><rect x="510" y="250" width="170" height="70" fill="#d7e8ed" stroke="#255965"/><text x="522" y="295">Sense amplifier</text><path d="M180 120H260 M430 120H510 M595 160V250" stroke="#255965" stroke-width="3" fill="none"/><text x="190" y="106" class="small">WL</text><text x="602" y="207" class="small">BL, parasitic C</text><text x="30" y="235">Drivers must supply write voltage, isolate reads,</text><text x="30" y="260">and protect low-voltage controller logic.</text><text x="30" y="365" class="small">Conceptual system schematic. Executed SPICE uses ideal read/write isolation and assumed cell conductance.</text></svg>
