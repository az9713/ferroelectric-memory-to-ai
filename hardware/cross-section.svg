<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 405" role="img" aria-label="Conceptual laminated ferroelectric gate stack"><title>Conceptual laminated ferroelectric gate stack</title><rect width="100%" height="100%" fill="#f8fafb"/><style>text{font:15px sans-serif;fill:#192c38}.small{font-size:12px}.label{font-weight:bold}</style><rect x="45" y="45" width="350" height="35" fill="#71899e"/><text x="420" y="68">Metal gate / injection barrier</text><rect x="45" y="87" width="350" height="35" fill="#69abb2"/><text x="420" y="110">HZO ferroelectric (upper)</text><rect x="45" y="129" width="350" height="35" fill="#ddb969"/><text x="420" y="152">Al₂O₃ tunnel insert</text><rect x="45" y="171" width="350" height="35" fill="#69abb2"/><text x="420" y="194">HZO ferroelectric (lower)</text><rect x="45" y="213" width="350" height="35" fill="#e4c990"/><text x="420" y="236">Interface dielectric</text><rect x="45" y="255" width="350" height="35" fill="#b7c6a0"/><text x="420" y="278">Semiconductor channel: Si, Ge, or oxide</text><text x="45" y="25" class="label">Conceptual laminated stack — not to scale</text><text x="45" y="332">Gate voltage divides across layers; trapped sheets alter displacement continuity.</text><text x="65" y="112">↑ P</text><text x="140" y="196">↓ P</text><text x="50" y="380" class="small">The channel is a separate material from the ferroelectric. This drawing specifies no fabrication process.</text></svg>
