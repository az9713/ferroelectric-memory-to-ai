<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 515" role="img" aria-label="Conceptual controller and abstract memory macro floorplan"><title>Conceptual controller and abstract memory macro floorplan</title><rect width="100%" height="100%" fill="#f8fafb"/><style>text{font:15px sans-serif;fill:#192c38}.small{font-size:12px}.label{font-weight:bold}</style><text x="30" y="26" class="label">Conceptual chip floorplan — 600 × 400 µm</text><rect x="40" y="55" width="600" height="400" fill="#eef3f4" stroke="#244b5b" stroke-width="2"/><rect x="80" y="95" width="180" height="100" fill="#b5cfae" stroke="#244b5b"/><text x="95" y="130">Digital controller</text><text x="95" y="155" class="small">Generic synthesis verified</text><rect x="360" y="205" width="80" height="100" fill="#83b5bd" stroke="#244b5b"/><text x="454" y="240">Abstract research macro</text><text x="454" y="266" class="small">Placement ≠ fabrication</text><path d="M260 145H310V255H360" fill="none" stroke="#b18236" stroke-width="8"/><text x="264" y="340" class="small">Illustrative bus route; no parasitic extraction</text><text x="65" y="430">I/O ring, power grid, clock tree, and routing rules remain unspecified.</text><text x="30" y="490" class="small">This is an inspectable planning layout, not placement/routing of a characterized standard-cell library.</text></svg>
